name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * *' # daily, 09:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # a merge needs real history, not a depth-1 checkout
      - name: Merge Asuna/huntalerts master into main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://projects.gamba.pro/Asuna/huntalerts.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:main
