name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'screenshots/**'
      - '*.png'
      - '*.mp4'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auto
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            throw 'Automatic releases must not run from pull requests.'
          }

          function Get-FourPartVersion([string]$value) {
            $parts = @($value.Split('.'))
            while ($parts.Count -lt 4) { $parts += '0' }
            if ($parts.Count -ne 4) {
              throw "Expected a four-part version, got '$value'"
            }
            return [version]::new(
              [int]$parts[0],
              [int]$parts[1],
              [int]$parts[2],
              [int]$parts[3]
            )
          }

          function Format-FourPartVersion([version]$ver) {
            return "$($ver.Major).$($ver.Minor).$($ver.Build).$($ver.Revision)"
          }

          $sha = $env:GITHUB_SHA
          $page = 1
          while ($true) {
            $batch = gh api "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page" | ConvertFrom-Json
            if (-not $batch -or @($batch).Count -eq 0) { break }
            foreach ($release in @($batch)) {
              $target = [string]$release.target_commitish
              if ($target -eq $sha -or ($sha.Length -ge 7 -and $target -eq $sha.Substring(0, 7))) {
                Write-Host "Commit $sha already has release $($release.tag_name); skipping."
                "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                exit 0
              }
            }
            if (@($batch).Count -lt 100) { break }
            $page++
          }

          [xml]$proj = Get-Content HuntAlerts/HuntAlerts.csproj
          $csprojVersion = Get-FourPartVersion ([string]$proj.Project.PropertyGroup.Version)

          $latestReleaseVersion = $null
          $page = 1
          while ($true) {
            $batch = gh api "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page" | ConvertFrom-Json
            if (-not $batch -or @($batch).Count -eq 0) { break }
            foreach ($release in @($batch)) {
              if ($release.tag_name -notmatch '^v(.+)$') { continue }
              $candidate = Get-FourPartVersion $Matches[1]
              if (-not $latestReleaseVersion -or $candidate -gt $latestReleaseVersion) {
                $latestReleaseVersion = $candidate
              }
            }
            if (@($batch).Count -lt 100) { break }
            $page++
          }

          if (-not $latestReleaseVersion) {
            $nextVersion = Format-FourPartVersion $csprojVersion
          } elseif ($csprojVersion -gt $latestReleaseVersion) {
            $nextVersion = Format-FourPartVersion $csprojVersion
          } else {
            $bumped = [version]::new(
              $latestReleaseVersion.Major,
              $latestReleaseVersion.Minor,
              $latestReleaseVersion.Build,
              $latestReleaseVersion.Revision + 1
            )
            $nextVersion = Format-FourPartVersion $bumped
          }

          $tag = "v$nextVersion"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release tag $tag already exists; skipping."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $tagRef = gh api "/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists; skipping."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          Write-Host "Next automatic release version: $nextVersion (tag $tag)"
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install the Dalamud development distribution
        if: steps.auto.outputs.skip != 'true'
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build huntalerts
        if: steps.auto.outputs.skip != 'true'
        shell: pwsh
        run: |
          $buildArgs = @('build', 'HuntAlerts/HuntAlerts.csproj', '-c', 'Release')
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $version = '${{ steps.auto.outputs.version }}'
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw 'Automatic release version was not computed.'
            }
            $buildArgs += @(
              "-p:Version=$version",
              "-p:AssemblyVersion=$version",
              "-p:FileVersion=$version"
            )
          }
          & dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        if: steps.auto.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $built = Get-ChildItem -Recurse -Filter latest.zip |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1
          if (-not $built) { throw 'latest.zip not found under bin/Release' }
          Copy-Item $built.FullName -Destination latest.zip -Force

          $pluginAssemblyName = [System.IO.Path]::GetFileNameWithoutExtension('HuntAlerts/HuntAlerts.csproj')

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path latest.zip))
          try {
            $dllEntries = @($archive.Entries | Where-Object { $_.Name -like '*.dll' })
            if ($dllEntries.Count -eq 0) {
              throw 'No plugin .dll found inside latest.zip'
            }

            $dllEntry = $dllEntries | Where-Object {
              [System.IO.Path]::GetFileNameWithoutExtension($_.Name) -ieq $pluginAssemblyName
            } | Select-Object -First 1
            if (-not $dllEntry) {
              $found = ($dllEntries | ForEach-Object { $_.Name }) -join ', '
              throw "Plugin .dll matching assembly name '$pluginAssemblyName' not found inside latest.zip (found: $found)"
            }

            $manifestName = [System.IO.Path]::ChangeExtension($dllEntry.Name, '.json')
            $manifestEntry = $archive.Entries | Where-Object { $_.Name -ieq $manifestName } | Select-Object -First 1
            if (-not $manifestEntry) {
              throw "Manifest '$manifestName' not found inside latest.zip (expected alongside $($dllEntry.Name))"
            }

            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try {
              $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            } finally {
              $reader.Close()
            }
          } finally {
            $archive.Dispose()
          }

          $assemblyVersion = [string]$manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($assemblyVersion)) {
            throw 'AssemblyVersion missing from plugin manifest'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $assemblyVersion) {
              throw "Tag version '$tagVersion' does not match AssemblyVersion '$assemblyVersion'"
            }
            gh release create $tag latest.zip --title $tag --generate-notes
            exit 0
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $expectedVersion = '${{ steps.auto.outputs.version }}'
            if ($assemblyVersion -ne $expectedVersion) {
              throw "AssemblyVersion '$assemblyVersion' does not match computed release version '$expectedVersion'"
            }
            $tag = "v$expectedVersion"
            gh release create $tag latest.zip --target $env:GITHUB_SHA --generate-notes
            exit 0
          }

          $tag = "v$assemblyVersion"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag latest.zip --title $tag --generate-notes
