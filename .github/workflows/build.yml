name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the Dalamud development distribution
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Run the offline logic tests
        run: dotnet run --project tests/HuntAlerts.Logic.Tests/HuntAlerts.Logic.Tests.csproj -c Release

      - name: Build huntalerts
        run: dotnet build HuntAlerts/HuntAlerts.csproj -c Release

      - name: Upload the plugin package
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: '**/bin/Release/**/latest.zip'
          if-no-files-found: error
